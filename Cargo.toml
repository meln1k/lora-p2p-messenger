[package]
name = "lora-p2p-messenger"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
defmt = "1"

embassy-executor = "0.9.0"
embassy-sync = "0.7"
embassy-time = { version = "0.5.0", features = ["defmt-timestamp-uptime"] }
embassy-net = { version = "0.7.0", features = ["medium-ethernet", "tcp", "udp"] }

# Display support
oled_async = { git = "https://github.com/techmccat/sh1106", rev = "bae800167836fa2387dec6f21695ec4f06cf3ec8" }
embedded-graphics = "0.8"
display-interface-i2c = "0.5"
heapless = "0.9.2"

embedded-hal-bus = "0.2"
lora-phy = { git = "https://github.com/lora-rs/lora-rs.git", rev = "0eb34e193fd265c597840bb11b9741427813e89c", features = ["defmt-03"]}
static_cell = "2.1.1"
embassy-embedded-hal = "0.5.0"
mousefood = "0.3.0"
ratatui = { version = "0.30.0", default-features = false }
embassy-futures = "0.1.2"
axp2101-dd = "0.2.2"
embedded-hal-async = "1.0.0"
qrcodegen-no-heap = "1.8.1"
embedded-io-async = "0.6.1"
edge-dhcp = "0.5.0"
edge-nal = "0.5.0"
edge-nal-embassy = "0.6.0"

[target.'cfg(target_arch = "xtensa")'.dependencies]
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal.git", rev = "0b9e4e052ec181659b5feac7da3ade60643291b7", features = [
    "panic-handler",
    "defmt",
] }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal.git", rev = "0b9e4e052ec181659b5feac7da3ade60643291b7" }
esp-hal = { git = "https://github.com/esp-rs/esp-hal.git", rev = "0b9e4e052ec181659b5feac7da3ade60643291b7", features = ["defmt", "unstable"] }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal.git", rev = "0b9e4e052ec181659b5feac7da3ade60643291b7", features = ["embassy", "defmt", "esp-radio"] }
esp-println = { git = "https://github.com/esp-rs/esp-hal.git", rev = "0b9e4e052ec181659b5feac7da3ade60643291b7", features = ["defmt-espflash"] }
esp-alloc = { git = "https://github.com/esp-rs/esp-hal.git", rev = "0b9e4e052ec181659b5feac7da3ade60643291b7" }
esp-radio = { git = "https://github.com/esp-rs/esp-hal.git", rev = "0b9e4e052ec181659b5feac7da3ade60643291b7", features = ["defmt", "wifi", "unstable"] }


[features]
default = ["esp32s3"]

esp32s3 = [
    "esp-backtrace/esp32s3",
    "esp-println/esp32s3",
    "esp-bootloader-esp-idf/esp32s3",
    "esp-rtos/esp32s3",
    "esp-hal/esp32s3",
    "esp-radio/esp32s3",
]

[profile.release]
debug = true
debug-assertions = true
lto = "fat"
codegen-units = 1
