[package]
name = "lora-p2p-messenger"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
defmt = "1.1.1"

embassy-executor = "0.10.0"
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["defmt-timestamp-uptime"] }
embassy-net = { version = "0.9.1", features = ["medium-ethernet", "tcp", "udp"] }

# Display support
oled_async = "0.2.1"
embedded-graphics = "0.8.2"
display-interface-i2c = "0.5.0"
heapless = "0.9.3"

embedded-hal-bus = "0.3.0"
lora-phy = { git = "https://github.com/lora-rs/lora-rs.git", rev = "2c0a9fd571668259dd71e5c786dfbe6d963e753f", features = ["defmt-03"]}
static_cell = "2.1.1"
embassy-embedded-hal = "0.6.0"
mousefood = "0.5.2"
ratatui = { version = "0.30.2", default-features = false }
embassy-futures = "0.1.2"
axp2101-dd = "0.3.1"
embedded-hal-async = "1.0.0"
qrcodegen-no-heap = "1.8.1"
embedded-io-async = "0.7.0"
edge-dhcp = "0.8.0"
edge-nal = "0.7.0"
edge-nal-embassy = "0.9.0"

[target.'cfg(target_arch = "xtensa")'.dependencies]
esp-backtrace = { version = "0.20.0", features = [
    "panic-handler",
    "defmt",
] }
esp-bootloader-esp-idf = { version = "0.6.0" }
esp-hal = { version = "1.2.2", features = ["defmt", "unstable"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "defmt", "esp-radio"] }
esp-println = { version = "0.18.0", features = ["defmt-espflash"] }
esp-alloc = { version = "0.11.0" }
esp-radio = { version = "1.0.0-beta.1", features = ["defmt", "wifi", "unstable"] }


[features]
default = ["esp32s3"]

esp32s3 = [
    "esp-backtrace/esp32s3",
    "esp-println/esp32s3",
    "esp-bootloader-esp-idf/esp32s3",
    "esp-rtos/esp32s3",
    "esp-hal/esp32s3",
    "esp-radio/esp32s3",
]

[profile.release]
debug = true
debug-assertions = true
lto = "fat"
codegen-units = 1
